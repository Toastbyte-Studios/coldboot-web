name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Lets you redeploy main from the Actions tab without a new commit.
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      # The build downloads the fonts from Google (astro.config.mjs) and copies
      # wrangler.jsonc into dist/ with the adapter's settings. `wrangler deploy`
      # below uploads that finished output; it does not build.
      - run: npm run build

      # Migrations run before the deploy so the schema is never behind the code
      # that queries it. `migrations apply` is idempotent: it skips anything
      # already recorded in the d1_migrations table, so re-running is a no-op.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply coldboot-waitlist --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
