name: CI

on:
  pull_request:
    branches: [main]

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Generates worker-configuration.d.ts from wrangler.jsonc, then runs
      # astro check. No Cloudflare credentials needed.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      # Also proves the fonts download from Google at build time, since
      # astro.config.mjs fetches them during the build.
      - run: npm run build
