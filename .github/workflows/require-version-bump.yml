name: Require version bump

on:
  pull_request_target:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  require-version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          fetch-depth: 0

      - name: Ensure package version is newer than the merge base
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ]; then
            base_ref="$BASE_SHA"
          else
            git fetch origin "$BASE_REF" --depth=1
            base_ref="origin/$BASE_REF"
          fi

          base_version=$(git show "$base_ref:package.json" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')

          node - "$base_version" <<'NODE'
          const fs = require('fs');

          const headVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const baseVersion = process.argv[2];

          const parse = (version) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (!match) throw new Error(`Unsupported version "${version}" (expected x.y.z).`);
            return match.slice(1).map(Number);
          };
          const head = parse(headVersion);
          const base = parse(baseVersion);
          const comparison = head[0] - base[0] || head[1] - base[1] || head[2] - base[2];

          if (comparison <= 0) {
            console.error(
              `package.json version (${headVersion}) must be newer than the merge base version (${baseVersion}).`,
            );
            process.exit(1);
          }

          console.log(`package.json version bump detected: ${baseVersion} -> ${headVersion}`);
          NODE
